name: ci

# The test gate. Hestia has never had one: before this file, `.github/workflows/`
# held only `app-android.yml` and `release.yml`, neither of which runs a test, and
# `git log --diff-filter=D -- .github/workflows/` is empty — this is a boundary
# being drawn for the first time, not a regression being restored.
#
# The invocation is deliberately unqualified. At the commit this file was added,
# `cargo test` runs five targets — lib (372), the `hestia` bin (8), `calib_export`
# (0), `tests/persistence.rs` (1), doc-tests (0) — so `--lib` reports a green that
# covers 372 of 381 and names none of the gap.
#
# But the count is not the argument, because the count moves. The target SET moves:
# `core/tests/` gains a file whenever someone wires an integration seam, and that
# file falls outside a `--lib` habit on the very day it is written, by the person
# least able to notice. Concretely, as this lands, `core/tests/rendered_layer.rs`
# exists only on the unmerged #62 branch — a target no reviewer running `--lib`
# could have exercised even in principle, because it was not yet in their tree.
# So the gate selects nothing: which targets a green covers must be a property of
# the repo, not a per-session choice, and the only invocation with that property is
# the one that chooses no target at all.
#
# `--locked` is not target selection. It fails if the build would rewrite
# Cargo.lock, so a dependency bump arrives as a reviewable diff rather than as
# CI drift.
#
# NOTE ON SCOPE: this workflow makes green a machine property of the commit at PR
# time. It does NOT make red block a merge — that is branch protection, which lives
# in repo settings and cannot be self-applied by a workflow file. Until a steward
# configures it, "CI exists" must not be read as "CI gates."

# ADDITION, 2026-07-28 (kimi): the first version of this job failed in 15 seconds
# on every PR — not in the tests, in the checkout. `core/Cargo.toml` carries four
# path dependencies into a SIBLING web4 checkout (`../../web4/{web4-core,
# hub-plugin, web4-trust-core, web4-policy}`), so this repo does not build from a
# lone clone, and "verified green before arming" had been verified on a machine
# that HAS the sibling — the instrument's own environment differed from the
# author's, the same class this gate exists to catch, caught by the gate's first
# firing. The second checkout below makes CI match the documented dev layout.
# It tracks web4 `main` deliberately: the path deps are a live integration seam
# (see the "drift seam" note in core/Cargo.toml), so a web4 break SHOULD red this
# gate — pinning a SHA would trade that signal for a silently stale sibling.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # The first attempt at this fix nested web4 INSIDE the workspace
      # (`path: web4` is relative to $GITHUB_WORKSPACE), and cargo still found
      # no sibling. Both checkouts name their own directory so the two repos
      # sit as siblings: <workspace>/hestia and <workspace>/web4 — which is
      # exactly what `../../web4` from hestia/core resolves to.
      - uses: actions/checkout@v4
        with:
          path: hestia

      # hestia-core's path deps point at ../../web4/... — the sibling must exist.
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/core

      - name: Test
        working-directory: hestia/core
        run: cargo test --locked

  # ADDITION, 2026-07-29 (CBP): `cargo test` was the whole gate, and the Rust crate is
  # not the whole repo. Three plugin directories hold real behavioural tests — member-mesh
  # runs the actual watcher and fire scripts against a stub daemon, plus claude-code's law
  # injection and gemini's fail-closed wrapper — and NOTHING RAN ANY OF THEM. FIVE test
  # files, green today, gating nothing: a check nobody consults is indistinguishable from a
  # check that does not exist, which is the same absence-as-OK shape the tests themselves
  # are about. Found while adding a sixth (identity refusal, #108 follow-up), where the
  # honest question was whether adding it changed anything. It did not, until this job.
  # The count is stated only to date it; the discovery below, not this comment, is the gate.
  #
  # DISCOVERED, not listed, for the reason the job above chooses no cargo target: which
  # tests a green covers must be a property of the repo, not of whoever last edited this
  # file. A new test file is gated the day it is written, by the author least able to
  # notice it was not. `set -e` in the loop makes one red fail the job.
  #
  # AMENDED, 2026-07-29 (CBP): the glob WAS the gate, and it was `plugins/*/tests/*_test.py`
  # — which could not see `plugins/lib/tests/test_path_scope.py` sitting in a directory it
  # globs, because the repo uses TWO naming conventions and this job knew one. Seven of
  # sixteen test-shaped files ran in no job at all, including all of tools/ and a suite
  # that shipped ungated in #92. Both jobs here refuse a glob matching ZERO; neither could
  # notice a glob matching seven of nine. That is the same absence-as-OK shape one layer
  # up from the tests, in the thing that runs them.
  #
  # So discovery moved OUT of this file into tools/ci_discovery.py, which CI calls and the
  # guards import. Not a glob copied into a test — the same code, so there is no copy to
  # drift. Anything it cannot run is declared, with a written reason, in
  # tools/ci_excluded_tests.txt; tools/ci_test_coverage_test.py fails on any file that is
  # neither run nor declared.
  #
  # No web4 sibling and no toolchain: these are hermetic Python — each spins its own stub
  # HTTP daemon on an ephemeral port. If that ever stops being true, this job is where it
  # will show up as a hang rather than as a lie.
  plugin-tests:
    name: plugin tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run every discovered test file (tools/ci_discovery.py bare)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(python3 tools/ci_discovery.py bare)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no plugin tests discovered — the layout moved"
            exit 1
          fi
          echo "discovered ${#tests[@]} test file(s):"
          printf '  %s\n' "${tests[@]}"
          # RUN ALL, THEN FAIL. A bare `python3 "$t"` under `set -e` exits the step
          # on the first red, so every test after it in discovery order never runs
          # and the report says "1 failure" no matter how many there are. Measured
          # 2026-07-31: main was red on ci_test_coverage_test.py AND
          # shebang_exec_bit_test.py, and only the first was ever visible — the
          # second was found by running the suite by hand with the first skipped.
          # A masked red is worse than a loud one: it reads as "one thing to fix",
          # so each fix costs a full CI round trip to reveal the next.
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            python3 "$t" || failed+=("$t")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::%s failed\n' "${failed[@]}"
            echo "FAILED ${#failed[@]} of ${#tests[@]}: ${failed[*]}"
            exit 1
          fi
          echo "all ${#tests[@]} passed"

  # ADDITION, 2026-07-28: the job above runs `cargo test`, and the ENFORCEMENT
  # SURFACE for a Claude Code member is not Rust. `pre_tool_use.py` is what
  # actually refuses a call; `witness.py` is what actually records one. Both are
  # python, both already had test files, and neither test had ever been executed
  # by CI — `test_law_inject.py` shipped in the repo and ran nowhere.
  #
  # That is the same defect as the one the job above was created to fix, one
  # language over: a green that covers the targets the gate happens to name, and
  # names none of the gap. The discovery is `python3 -m compileall`-cheap, so
  # there is no cost argument for leaving it out.
  #
  # No dependencies, no sibling checkout: these tests import only stdlib and the
  # hook modules next to them. Discovery is by glob rather than an enumerated
  # list, deliberately — an enumerated list falls out of date on the day someone
  # adds a test, by the person least able to notice.
  hooks:
    name: hook tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test hooks
        run: |
          set -euo pipefail
          # Discovery comes from tools/ci_discovery.py (mode: hooks), the same
          # module the plugin-tests job and the coverage guards use. This job
          # used its OWN glob (`test_*.py`) while the other used `*_test.py`,
          # and each was blind to the other's convention — which is how seven
          # files ended up in neither. One discovery, three consumers.
          mapfile -t tests < <(python3 tools/ci_discovery.py hooks)
          # A discovery that matches nothing must fail loudly. Silently passing
          # on zero tests is the "absence read as pass" failure this gate
          # exists to refuse.
          [ ${#tests[@]} -gt 0 ] || { echo "::error::no hook tests found — refusing to report green"; exit 1; }
          echo "discovered ${#tests[@]} hook test file(s):"
          printf '  %s\n' "${tests[@]}"
          # Run all, then fail — same reason as the plugin-tests job above: under
          # `set -e` the first red hides every test after it, and the count in the
          # report becomes 1 regardless of the truth.
          failed=()
          for t in "${tests[@]}"; do
            echo "== $t"
            # These import the hook modules sitting beside them, so they run
            # from their own directory — the reason this job exists separately.
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" ) || failed+=("$t")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::%s failed\n' "${failed[@]}"
            echo "FAILED ${#failed[@]} of ${#tests[@]}: ${failed[*]}"
            exit 1
          fi
          echo "all ${#tests[@]} passed"
