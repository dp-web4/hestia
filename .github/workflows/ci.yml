name: ci

# The test gate. Hestia has never had one: before this file, `.github/workflows/`
# held only `app-android.yml` and `release.yml`, neither of which runs a test, and
# `git log --diff-filter=D -- .github/workflows/` is empty — this is a boundary
# being drawn for the first time, not a regression being restored.
#
# The invocation is deliberately unqualified. At the commit this file was added,
# `cargo test` runs five targets — lib (372), the `hestia` bin (8), `calib_export`
# (0), `tests/persistence.rs` (1), doc-tests (0) — so `--lib` reports a green that
# covers 372 of 381 and names none of the gap.
#
# But the count is not the argument, because the count moves. The target SET moves:
# `core/tests/` gains a file whenever someone wires an integration seam, and that
# file falls outside a `--lib` habit on the very day it is written, by the person
# least able to notice. Concretely, as this lands, `core/tests/rendered_layer.rs`
# exists only on the unmerged #62 branch — a target no reviewer running `--lib`
# could have exercised even in principle, because it was not yet in their tree.
# So the gate selects nothing: which targets a green covers must be a property of
# the repo, not a per-session choice, and the only invocation with that property is
# the one that chooses no target at all.
#
# `--locked` is not target selection. It fails if the build would rewrite
# Cargo.lock, so a dependency bump arrives as a reviewable diff rather than as
# CI drift.
#
# NOTE ON SCOPE: this workflow makes green a machine property of the commit at PR
# time. It does NOT make red block a merge — that is branch protection, which lives
# in repo settings and cannot be self-applied by a workflow file. Until a steward
# configures it, "CI exists" must not be read as "CI gates."

# ADDITION, 2026-07-28 (kimi): the first version of this job failed in 15 seconds
# on every PR — not in the tests, in the checkout. `core/Cargo.toml` carries four
# path dependencies into a SIBLING web4 checkout (`../../web4/{web4-core,
# hub-plugin, web4-trust-core, web4-policy}`), so this repo does not build from a
# lone clone, and "verified green before arming" had been verified on a machine
# that HAS the sibling — the instrument's own environment differed from the
# author's, the same class this gate exists to catch, caught by the gate's first
# firing. The second checkout below makes CI match the documented dev layout.
# It tracks web4 `main` deliberately: the path deps are a live integration seam
# (see the "drift seam" note in core/Cargo.toml), so a web4 break SHOULD red this
# gate — pinning a SHA would trade that signal for a silently stale sibling.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # The first attempt at this fix nested web4 INSIDE the workspace
      # (`path: web4` is relative to $GITHUB_WORKSPACE), and cargo still found
      # no sibling. Both checkouts name their own directory so the two repos
      # sit as siblings: <workspace>/hestia and <workspace>/web4 — which is
      # exactly what `../../web4` from hestia/core resolves to.
      - uses: actions/checkout@v4
        with:
          path: hestia

      # hestia-core's path deps point at ../../web4/... — the sibling must exist.
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4

      # AC-E1 (PRD_R6_R7_ENVELOPES §8) verifies §2's file:line citations AT web4.pin,
      # not at web4 main — the anchors were recorded against the pin, so main would
      # report drift that is not drift. The checkout above is `main` at fetch-depth 1,
      # so the pin object is absent and the check would skip. Fetch exactly that one
      # commit: `--depth 1 <sha>` costs one object graph, not web4's whole history,
      # which is why this is a targeted fetch rather than `fetch-depth: 0` above.
      # If the pin is unreachable the check SKIPS loudly rather than reddening — so a
      # failure here is a real fetch problem, not a citation problem.
      - name: Fetch the web4.pin object (for the PRD citation check)
        run: |
          rev="$(grep -oiE '[0-9a-f]{40}' hestia/web4.pin | head -1)"
          git -C web4 fetch --depth 1 origin "$rev"

      - name: PRD R6/R7 §2 citations resolve at the pin (AC-E1, AC-E2)
        working-directory: hestia
        run: python3 tools/prd_r6_r7_citation_test.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/core

      # `hestia-wire` is a separate crate. Core and app compile it as a
      # dependency, but Cargo does not run dependency-crate unit tests; invoke
      # its golden-vector and framing controls explicitly.
      - name: Test shared wire formats
        working-directory: hestia/wire
        run: cargo test --locked

      - name: Test
        working-directory: hestia/core
        run: cargo test --locked

  # The app is a separate Rust crate plus a TypeScript frontend. Core green says
  # nothing about either: Sprint A demonstrated the gap when an app-only helper
  # passed its tests while the production sign-in path never called it.
  app-tests:
    name: app tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hestia

      # app/src-tauri consumes the sibling identity crate by path, matching the
      # development layout and the core job above.
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4

      - uses: actions/setup-node@v4
        with:
          # react-router 8.3 declares >=22.22; Node 20 produces an unsupported
          # engine warning even when the bundle happens to complete.
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: hestia/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/app/src-tauri -> target

      - name: Install Tauri Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install frontend dependencies
        working-directory: hestia/app
        run: npm ci

      - name: Test Rust shell
        working-directory: hestia/app/src-tauri
        run: cargo test --locked

      - name: Build frontend
        working-directory: hestia/app
        run: npm run build

  # ADDITION, 2026-07-29 (CBP): `cargo test` was the whole gate, and the Rust crate is
  # not the whole repo. Three plugin directories hold real behavioural tests — member-mesh
  # runs the actual watcher and fire scripts against a stub daemon, plus claude-code's law
  # injection and gemini's fail-closed wrapper — and NOTHING RAN ANY OF THEM. FIVE test
  # files, green today, gating nothing: a check nobody consults is indistinguishable from a
  # check that does not exist, which is the same absence-as-OK shape the tests themselves
  # are about. Found while adding a sixth (identity refusal, #108 follow-up), where the
  # honest question was whether adding it changed anything. It did not, until this job.
  # The count is stated only to date it; the discovery below, not this comment, is the gate.
  #
  # DISCOVERED, not listed, for the reason the job above chooses no cargo target: which
  # tests a green covers must be a property of the repo, not of whoever last edited this
  # file. A new test file is gated the day it is written, by the author least able to
  # notice it was not. `set -e` in the loop makes one red fail the job.
  #
  # AMENDED, 2026-07-29 (CBP): the glob WAS the gate, and it was `plugins/*/tests/*_test.py`
  # — which could not see `plugins/lib/tests/test_path_scope.py` sitting in a directory it
  # globs, because the repo uses TWO naming conventions and this job knew one. Seven of
  # sixteen test-shaped files ran in no job at all, including all of tools/ and a suite
  # that shipped ungated in #92. Both jobs here refuse a glob matching ZERO; neither could
  # notice a glob matching seven of nine. That is the same absence-as-OK shape one layer
  # up from the tests, in the thing that runs them.
  #
  # So discovery moved OUT of this file into tools/ci_discovery.py, which CI calls and the
  # guards import. Not a glob copied into a test — the same code, so there is no copy to
  # drift. Anything it cannot run is declared, with a written reason, in
  # tools/ci_excluded_tests.txt; tools/ci_test_coverage_test.py fails on any file that is
  # neither run nor declared.
  #
  # No web4 sibling and no toolchain: these are hermetic Python — each spins its own stub
  # HTTP daemon on an ephemeral port. If that ever stops being true, this job is where it
  # will show up as a hang rather than as a lie.
  plugin-tests:
    name: plugin tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run every discovered test file (tools/ci_discovery.py bare)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(python3 tools/ci_discovery.py bare)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no plugin tests discovered — the layout moved"
            exit 1
          fi
          echo "discovered ${#tests[@]} test file(s):"
          printf '  %s\n' "${tests[@]}"
          # RUN ALL, THEN FAIL. A bare `python3 "$t"` under `set -e` exits the step
          # on the first red, so every test after it in discovery order never runs
          # and the report says "1 failure" no matter how many there are. Measured
          # 2026-07-31: main was red on ci_test_coverage_test.py AND
          # shebang_exec_bit_test.py, and only the first was ever visible — the
          # second was found by running the suite by hand with the first skipped.
          # A masked red is worse than a loud one: it reads as "one thing to fix",
          # so each fix costs a full CI round trip to reveal the next.
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            python3 "$t" || failed+=("$t")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::%s failed\n' "${failed[@]}"
            echo "FAILED ${#failed[@]} of ${#tests[@]}: ${failed[*]}"
            exit 1
          fi
          echo "all ${#tests[@]} passed"

  # ADDITION, 2026-07-28: the job above runs `cargo test`, and the ENFORCEMENT
  # SURFACE for a Claude Code member is not Rust. `pre_tool_use.py` is what
  # actually refuses a call; `witness.py` is what actually records one. Both are
  # python, both already had test files, and neither test had ever been executed
  # by CI — `test_law_inject.py` shipped in the repo and ran nowhere.
  #
  # That is the same defect as the one the job above was created to fix, one
  # language over: a green that covers the targets the gate happens to name, and
  # names none of the gap. The discovery is `python3 -m compileall`-cheap, so
  # there is no cost argument for leaving it out.
  #
  # No dependencies, no sibling checkout: these tests import only stdlib and the
  # hook modules next to them. Discovery is by glob rather than an enumerated
  # list, deliberately — an enumerated list falls out of date on the day someone
  # adds a test, by the person least able to notice.
  hooks:
    name: hook tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test hooks
        # The seats resolve runtime law ONLY from an explicit HESTIA_SHARED_DIR or an
        # installed $HESTIA_HOME/shared (#742 for codex, #747 for claude-code). A CI runner
        # has no installed engine, and the repository checkout is deliberately NOT an
        # implicit fallback any more -- that fallback is what let a hook execute whatever
        # law the branch happened to carry. So the runner names the reviewed shared tree
        # explicitly: a test fixture, chosen and visible, not an ambient path lookup.
        env:
          HESTIA_SHARED_DIR: ${{ github.workspace }}/plugins/_shared
        run: |
          set -euo pipefail
          # Discovery comes from tools/ci_discovery.py (mode: hooks), the same
          # module the plugin-tests job and the coverage guards use. This job
          # used its OWN glob (`test_*.py`) while the other used `*_test.py`,
          # and each was blind to the other's convention — which is how seven
          # files ended up in neither. One discovery, three consumers.
          mapfile -t tests < <(python3 tools/ci_discovery.py hooks)
          # A discovery that matches nothing must fail loudly. Silently passing
          # on zero tests is the "absence read as pass" failure this gate
          # exists to refuse.
          [ ${#tests[@]} -gt 0 ] || { echo "::error::no hook tests found — refusing to report green"; exit 1; }
          echo "discovered ${#tests[@]} hook test file(s):"
          printf '  %s\n' "${tests[@]}"
          # Run all, then fail — same reason as the plugin-tests job above: under
          # `set -e` the first red hides every test after it, and the count in the
          # report becomes 1 regardless of the truth.
          failed=()
          for t in "${tests[@]}"; do
            echo "== $t"
            # These import the hook modules sitting beside them, so they run
            # from their own directory — the reason this job exists separately.
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" ) || failed+=("$t")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::%s failed\n' "${failed[@]}"
            echo "FAILED ${#failed[@]} of ${#tests[@]}: ${failed[*]}"
            exit 1
          fi
          echo "all ${#tests[@]} passed"

  # ADDITION: the ratchet under the engine collapse.
  #
  # The `hooks` job above runs each seat's tests FROM ITS OWN DIRECTORY, which is
  # correct for what it tests and is also exactly why the seats drift: it proves
  # every seat is self-consistent and compares no seat to any other. A fix that
  # lands in one seat's file is green. Three seats, three greens, one law that
  # differs by seat.
  #
  # "The seats all import the shared closure" was true and reported as done for
  # weeks. It was never the question. The question is what fraction of
  # LAW-BEARING code still executes per-seat, and on the day this job was added
  # the answer was 67.7% -- with claude-code alone carrying more law-bearing
  # SLOC (1,654) than the shared engine's law-bearing portion (1,470).
  #
  # This job does not require the number to fall. It requires that it not RISE.
  # Lower the pins in the same PR that lowers the number; that edit is the
  # progress record, and it is the thing a verdict could never be.
  collapse-ratchet:
    name: gate collapse ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure how much of the gate still executes per-seat
        run: |
          set -euo pipefail
          # THREE pins now, because the fork count was one number over two
          # opposite risks and that cost us a landing.
          #
          # --max-divergent-forked is the tight one and keeps the old meaning:
          # a name the shared engine owns, implemented a SECOND TIME with a
          # different body. All 4 are gemini's scope predicates, and the step
          # below independently finds 6 inputs they answer differently from the
          # engine. This number may not rise.
          #
          # --max-verbatim-forked counts copies that are character-for-character
          # the engine's. It is 0 and stays 0. It briefly stood at 16 to admit
          # claude-code's shell classifier while a two-step move published it
          # before deleting it; that transition was wrong. A move publishes and
          # deletes in ONE act, and the deploy-order problem it was working
          # around got fixed instead (install-members.sh now repoints
          # $HESTIA_HOME/shared BEFORE writing any hook, so a hook can never be
          # newer than the engine it imports). Duplicate law is not preserved to
          # accommodate the deploy mechanism.
          #
          # --max-pct is still the number that actually matters and still
          # depends on a published vocabulary, so it is arguable -- which is a
          # reason to print it every run, not a reason to leave it unpinned.
          # 52.3, not 52.2. The cutover measured 52.2; the mandated fail-closed
          # import guard (missing shared authority -> exit 2, proven by
          # plugins/claude-code/tests/missing_shared_authority_blocks_test.py)
          # added 11 law-bearing sloc to the seat and moved it to 52.3. Pinned at
          # the MEASURED value. The alternative was writing terser refusal code to
          # hit a round number, which is optimising the gauge instead of the thing.
          # 52.8, not 52.3. Review of #747 found the negative test did not model
          # an ABSENT install (an existing empty dir suppressed the repo fallback),
          # so the fallback and two unconditional working-tree resolutions were
          # deleted and replaced by ONE installed-only loader, BYTE-IDENTICAL to
          # codex's (#742 head 03a0ba8), asserted by the staging script, not
          # eyeballed. The loader is per-seat law the meter counts. It cannot
          # live in shared authority because it IS the reach to shared authority.
          # (An earlier version of this comment predicted the verbatim ratchet
          # would trip when both seats carried one loader text. Wrong: that grade
          # covers only names the SHARED ENGINE owns, and the loader is not one; a
          # duplicated loader lands in the informational unshared-fork surface,
          # as _load_mechanism already does. Recorded so the next reader does not
          # inherit the prediction.)
          #
          # PER SEAT, NOT FLEET (#771). The fleet aggregate let one shim's added
          # authority read as a fleet regression and let three lean adapters dilute
          # one forked shim. Bounds are now one per discovered seat, at the MEASURED
          # value on this head; a regression names its seat and moves no other
          # seat's number. A pinned seat that is not discovered fails: unmeasurable
          # is not compliant. The aggregate is still printed, labeled TREND, and
          # decides nothing. Deployment readiness over RESIDENT bytes is the other
          # instrument (tools/installed_seat_readiness.py); CI has no installed
          # seats, so its self-test runs in the plugin-tests job instead.
          #
          # codex 25.0, not 23.9 (#742): the installed-only loader and its refusal
          # path are per-seat mechanics the meter counts as law. Moved to the
          # measured value on that head and no other seat's pin touched, which is
          # the point of pinning per seat: the same change under the fleet gauge
          # read as "the fleet regressed 0.1".
          #
          # Slice 3 (#796) moved the five codex/kimi gate-self bodies into the
          # shared mechanism. Codex and kimi lose the duplicated bodies; the
          # shared-law denominator grows for every seat, so all four measured
          # percentages fall. Pin the exact post-move values in the same PR: a
          # lower number left only in the PR prose is not a ratchet.
          python3 tools/gate_collapse_meter.py \
            --max-divergent-forked 0 --max-verbatim-forked 0 \
            --max-seat-pct claude-code=28.8 --max-seat-pct codex=20.5 \
            --max-seat-pct gemini=10.3 --max-seat-pct kimi=16.8

      - name: Do the forked predicates actually disagree with the engine?
        run: |
          set -euo pipefail
          # A fork count is debt; a divergence count is exposure. This pins how
          # many inputs the forked scope predicates answer differently from the
          # shared engine -- currently 6, every one of them a defect class the
          # engine's own docstring says it was hardened against. Collapsing a
          # fork is what drives it down.
          # 0 divergent forks and 0 differential divergences (slice 4): gemini's four
          # scope predicates -- the fleet's last forks of engine-owned names, all measured
          # fail-open -- are deleted and delegate to the core. gemini 10.7, not 8.8: the
          # installed-only loader is per-seat mechanics the meter counts as law, the same
          # move codex made at 25.0. The differential is now a WIRING pin: any re-fork
          # reads as a divergence and trips at zero.
          python3 tools/scope_fork_differential_test.py --max-divergences 0

      - name: Is every seat reaching for the same domain?
        run: |
          set -euo pipefail
          # The collapse percentage measures the PREDICATE. This pins the DOMAIN
          # the predicate is applied to, which every seat builds itself before
          # the engine is ever called (#734). A gate can reach 0.0% per-seat law
          # and still disagree with its peers about which argument is a path.
          # Floor is the measured number, 3 of 10, so it ratchets up from
          # reality rather than aspiring downward from a target nobody hit.
          # Deliberately a SEPARATE step from the collapse meter above: one
          # number failing should not hide the other behind set -e.
          # 10, not 3 (slice 5): the reach domain is ONE engine table and every seat
          # consumes it, so agreed == union by construction. This floor now guards the
          # DELEGATION: a seat that re-declares its own key list reads as omitting
          # whatever it forgot, and trips here. claude-code's pin moved 28.7 -> 28.8:
          # the delegation's own comment carries law vocabulary the meter counts;
          # codex/gemini/kimi dropped to their measured floors in the same act.
          python3 tools/gate_collapse_meter.py --quiet --min-agreed-keys 10
