name: ci

# The test gate. Hestia has never had one: before this file, `.github/workflows/`
# held only `app-android.yml` and `release.yml`, neither of which runs a test, and
# `git log --diff-filter=D -- .github/workflows/` is empty — this is a boundary
# being drawn for the first time, not a regression being restored.
#
# The invocation is deliberately unqualified. At the commit this file was added,
# `cargo test` runs five targets — lib (372), the `hestia` bin (8), `calib_export`
# (0), `tests/persistence.rs` (1), doc-tests (0) — so `--lib` reports a green that
# covers 372 of 381 and names none of the gap.
#
# But the count is not the argument, because the count moves. The target SET moves:
# `core/tests/` gains a file whenever someone wires an integration seam, and that
# file falls outside a `--lib` habit on the very day it is written, by the person
# least able to notice. Concretely, as this lands, `core/tests/rendered_layer.rs`
# exists only on the unmerged #62 branch — a target no reviewer running `--lib`
# could have exercised even in principle, because it was not yet in their tree.
# So the gate selects nothing: which targets a green covers must be a property of
# the repo, not a per-session choice, and the only invocation with that property is
# the one that chooses no target at all.
#
# `--locked` is not target selection. It fails if the build would rewrite
# Cargo.lock, so a dependency bump arrives as a reviewable diff rather than as
# CI drift.
#
# NOTE ON SCOPE: this workflow makes green a machine property of the commit at PR
# time. It does NOT make red block a merge — that is branch protection, which lives
# in repo settings and cannot be self-applied by a workflow file. Until a steward
# configures it, "CI exists" must not be read as "CI gates."

# ADDITION, 2026-07-28 (kimi): the first version of this job failed in 15 seconds
# on every PR — not in the tests, in the checkout. `core/Cargo.toml` carries four
# path dependencies into a SIBLING web4 checkout (`../../web4/{web4-core,
# hub-plugin, web4-trust-core, web4-policy}`), so this repo does not build from a
# lone clone, and "verified green before arming" had been verified on a machine
# that HAS the sibling — the instrument's own environment differed from the
# author's, the same class this gate exists to catch, caught by the gate's first
# firing. The second checkout below makes CI match the documented dev layout.
# It tracks web4 `main` deliberately: the path deps are a live integration seam
# (see the "drift seam" note in core/Cargo.toml), so a web4 break SHOULD red this
# gate — pinning a SHA would trade that signal for a silently stale sibling.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # The first attempt at this fix nested web4 INSIDE the workspace
      # (`path: web4` is relative to $GITHUB_WORKSPACE), and cargo still found
      # no sibling. Both checkouts name their own directory so the two repos
      # sit as siblings: <workspace>/hestia and <workspace>/web4 — which is
      # exactly what `../../web4` from hestia/core resolves to.
      - uses: actions/checkout@v4
        with:
          path: hestia

      # hestia-core's path deps point at ../../web4/... — the sibling must exist.
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/core

      - name: Test
        working-directory: hestia/core
        run: cargo test --locked

  # ADDITION, 2026-07-28: the job above runs `cargo test`, and the ENFORCEMENT
  # SURFACE for a Claude Code member is not Rust. `pre_tool_use.py` is what
  # actually refuses a call; `witness.py` is what actually records one. Both are
  # python, both already had test files, and neither test had ever been executed
  # by CI — `test_law_inject.py` shipped in the repo and ran nowhere.
  #
  # That is the same defect as the one the job above was created to fix, one
  # language over: a green that covers the targets the gate happens to name, and
  # names none of the gap. The discovery is `python3 -m compileall`-cheap, so
  # there is no cost argument for leaving it out.
  #
  # No dependencies, no sibling checkout: these tests import only stdlib and the
  # hook modules next to them. Discovery is by glob rather than an enumerated
  # list, deliberately — an enumerated list falls out of date on the day someone
  # adds a test, by the person least able to notice.
  hooks:
    name: hook tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test hooks
        working-directory: plugins/claude-code/hooks
        run: |
          set -e
          found=0
          for t in test_*.py; do
            [ -e "$t" ] || continue
            found=1
            echo "== $t"
            python3 "$t"
          done
          # A glob that matches nothing must fail loudly. Silently passing on
          # zero tests is the "absence read as pass" failure this gate exists
          # to refuse.
          [ "$found" = 1 ] || { echo "no hook tests found — refusing to report green"; exit 1; }
