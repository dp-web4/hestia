name: ci

# The test gate. Hestia has never had one: before this file, `.github/workflows/`
# held only `app-android.yml` and `release.yml`, neither of which runs a test, and
# `git log --diff-filter=D -- .github/workflows/` is empty — this is a boundary
# being drawn for the first time, not a regression being restored.
#
# The invocation is deliberately unqualified. At the commit this file was added,
# `cargo test` runs five targets — lib (372), the `hestia` bin (8), `calib_export`
# (0), `tests/persistence.rs` (1), doc-tests (0) — so `--lib` reports a green that
# covers 372 of 381 and names none of the gap.
#
# But the count is not the argument, because the count moves. The target SET moves:
# `core/tests/` gains a file whenever someone wires an integration seam, and that
# file falls outside a `--lib` habit on the very day it is written, by the person
# least able to notice. Concretely, as this lands, `core/tests/rendered_layer.rs`
# exists only on the unmerged #62 branch — a target no reviewer running `--lib`
# could have exercised even in principle, because it was not yet in their tree.
# So the gate selects nothing: which targets a green covers must be a property of
# the repo, not a per-session choice, and the only invocation with that property is
# the one that chooses no target at all.
#
# `--locked` is not target selection. It fails if the build would rewrite
# Cargo.lock, so a dependency bump arrives as a reviewable diff rather than as
# CI drift.
#
# NOTE ON SCOPE: this workflow makes green a machine property of the commit at PR
# time. It does NOT make red block a merge — that is branch protection, which lives
# in repo settings and cannot be self-applied by a workflow file. Until a steward
# configures it, "CI exists" must not be read as "CI gates."
#
# And one clause further, learned the hard way below: until a green has actually
# been observed, "CI runs" must not be read as "CI exists." The sentence above was
# written by a file that could not resolve its own dependency graph.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # Two checkouts, because `core/Cargo.toml` has four path dependencies that
      # leave the repository: `web4-core`, `hub/hub-plugin`, `web4-trust-core` and
      # `web4-policy`, all `../../web4/...` — i.e. resolved against the PARENT of
      # the hestia checkout. A single default `actions/checkout@v4` puts hestia at
      # `$GITHUB_WORKSPACE` with nothing beside it, so cargo cannot even build the
      # dependency graph: every run of this workflow between 2026-07-27T23:42Z
      # (#78's own PR) and this commit died in 8-22s on
      #
      #   error: failed to get `hub-plugin` as a dependency of package `hestia`
      #   Caused by: failed to read /home/runner/work/hestia/web4/hub/hub-plugin/Cargo.toml
      #
      # — ten consecutive runs, zero greens, including the four pushes to `main`
      # that merged #62/#67/#70/#81 and the two PRs open at the time. The gate was
      # installed and never once ran a test. It read as armed because `gh pr checks`
      # reported a named check, and because red does not block a merge (see NOTE ON
      # SCOPE above), so nothing forced anyone to open the log. A gate that has
      # never been green cannot tell you a regression from its own misconfiguration:
      # its red carries no information. Whoever next touches this file should make
      # it fail for the RIGHT reason once before trusting a green.
      #
      # `path:` is required on both — checkout refuses a destination outside the
      # workspace, so hestia cannot be placed one directory down from `web4`; both
      # are placed one directory IN, which resolves the same relative path.
      - name: Check out hestia
        uses: actions/checkout@v4
        with:
          path: hestia

      - name: Check out the sibling web4 (four path deps in core/Cargo.toml)
        uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/core

      - name: Test
        working-directory: hestia/core
        run: cargo test --locked
