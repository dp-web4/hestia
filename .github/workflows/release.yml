name: release

# Builds prebuilt hestia binaries and attaches them to a GitHub Release.
# Tag pushes / workflow_dispatch publish. Pull requests run the SAME build
# matrix as a release smoke test but never publish, so platform/toolchain
# regressions are measured before they reach a tag.
#
# RELEASE INPUTS ARE PART OF THE ARTIFACT. Hestia currently consumes Web4
# crates through sibling path dependencies, which Cargo.lock cannot pin.
# Integration CI intentionally tracks Web4 main; releases MUST NOT. Bump
# WEB4_REF deliberately before creating each release tag.
env:
  WEB4_REF: 9958fc6a37279a8fad2872fec1a07ea3ec92224b

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.4). Must already exist.'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          # Windows restored independently after the first v0.0.4 matrix exposed
          # SQLCipher's missing crypto-provider discovery. This PR must prove both
          # that it LINKS and that the resulting EXE does not depend on an external
          # libcrypto/libssl DLL before the row can reach main.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4
          ref: ${{ env.WEB4_REF }}

      - name: Record release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "hestia_ref=${{ github.event.inputs.tag || github.ref_name }}"
          echo "web4_ref=${WEB4_REF}"
          test "$(git -C web4 rev-parse HEAD)" = "$WEB4_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rusqlite 0.31's `bundled-sqlcipher` bundles SQLCipher but expects the
      # crypto provider from the host. libsqlite3-sys consults OPENSSL_DIR /
      # OPENSSL_INCLUDE_DIR / OPENSSL_LIB_DIR. The GitHub Windows image includes
      # OpenSSL, but the first real release build showed those paths are not
      # exported for build scripts. Discover the actual development files rather
      # than pinning a machine path; fail before Cargo if the image changes.
      - name: Locate OpenSSL for SQLCipher (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $roots = [System.Collections.Generic.List[string]]::new()
          foreach ($candidate in @(
            'C:\Program Files\OpenSSL',
            'C:\Program Files\OpenSSL-Win64',
            'C:\OpenSSL-Win64'
          )) {
            if (Test-Path $candidate) { $roots.Add($candidate) }
          }

          $opensslCmd = Get-Command openssl.exe -ErrorAction SilentlyContinue
          if ($opensslCmd) {
            $bin = Split-Path $opensslCmd.Source -Parent
            $root = Split-Path $bin -Parent
            if (Test-Path $root) { $roots.Add($root) }
          }

          $selected = $null
          $crypto = $null
          foreach ($root in ($roots | Select-Object -Unique)) {
            $header = Join-Path $root 'include\openssl\ssl.h'
            if (-not (Test-Path $header)) { continue }
            $crypto = Get-ChildItem -Path $root -Recurse -File -Filter 'libcrypto.lib' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($crypto) {
              $selected = $root
              break
            }
          }

          if (-not $selected -or -not $crypto) {
            Write-Host 'Candidate OpenSSL roots:'
            $roots | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
            throw 'OpenSSL development headers/libcrypto.lib not found on the Windows runner'
          }

          $include = Join-Path $selected 'include'
          $lib = Split-Path $crypto.FullName -Parent
          "OPENSSL_DIR=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "OPENSSL_DIR=$selected"
          Write-Host "OPENSSL_INCLUDE_DIR=$include"
          Write-Host "OPENSSL_LIB_DIR=$lib"
          if ($opensslCmd) { & $opensslCmd.Source version }

      - name: Build hestia
        working-directory: hestia/core
        run: cargo build --release --locked --target ${{ matrix.target }}

      # A compile on a machine that already carries OpenSSL is insufficient evidence
      # for a downloadable single-executable artifact. Inspect the PE import table and
      # reject a binary that would require users to install libcrypto/libssl beside it.
      - name: Assert Windows executable is standalone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found; cannot inspect PE dependencies' }
          $vs = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $toolset = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolset) { throw 'MSVC toolset not found' }
          $dumpbin = Join-Path $toolset.FullName 'bin\Hostx64\x64\dumpbin.exe'
          if (-not (Test-Path $dumpbin)) { throw "dumpbin not found at $dumpbin" }

          $exe = "hestia/core/target/${{ matrix.target }}/release/hestia.exe"
          $deps = (& $dumpbin /dependents $exe | Out-String)
          Write-Host $deps
          if ($deps -match '(?i)libcrypto|libssl') {
            throw 'Windows release depends on an external OpenSSL DLL; not a standalone artifact'
          }

      - name: Stage artifacts (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="hestia-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "hestia/core/target/${{ matrix.target }}/release/hestia" "dist/${STAGE}/"
          cp hestia/README.md hestia/LICENSE "dist/${STAGE}/" 2>/dev/null || true
          (cd dist && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          (cd dist && sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256")
          ls -la dist/

      - name: Stage artifacts (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $stage = "hestia-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage" | Out-Null
          Copy-Item "hestia/core/target/${{ matrix.target }}/release/hestia.exe" "dist/$stage/"
          if (Test-Path "hestia/README.md") { Copy-Item "hestia/README.md" "dist/$stage/" }
          if (Test-Path "hestia/LICENSE") { Copy-Item "hestia/LICENSE" "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Set-Content "dist/$stage.zip.sha256"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hestia-${{ matrix.target }}
          path: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
            dist/hestia-*.zip
            dist/hestia-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Prebuilt `hestia` daemon binaries for the targets attached to this release.

            Build provenance: Web4 `${{ env.WEB4_REF }}`.

            Linux example:
            ```sh
            curl -L https://github.com/dp-web4/hestia/releases/download/${{ github.event.inputs.tag || github.ref_name }}/hestia-${{ github.event.inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz | tar -xz
            ./hestia-${{ github.event.inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu/hestia --version
            ```

            The dashboard HTML is baked into the binary; nothing else is required to run.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
            dist/hestia-*.zip
            dist/hestia-*.zip.sha256
