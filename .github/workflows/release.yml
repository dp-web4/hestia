name: release

# ONE TAG, ONE RELEASE (web4#904 phase 1; dp, 2026-10-11). Pushing the tag `vX.Y.Z` builds every
# hestia artifact from that tag and publishes them together under ONE GitHub Release:
#
#   daemon   hestia-vX.Y.Z-<target>.tar.gz          x86_64/aarch64 linux, aarch64 macOS
#   desktop  hestia-app-vX.Y.Z-x86_64-linux.{AppImage,deb}
#            hestia-app-vX.Y.Z-aarch64-macos.{dmg,app.tar.gz}
#   android  hestia-app-vX.Y.Z-android-universal.apk
#   each with a `.sha256`, plus one SHA256SUMS over all of them.
#
# Jobs and their order:
#
#   version ──┬── build (daemon matrix) ──┐
#             ├── desktop (tauri matrix) ─┼── assemble ──┐
#             ├── android ────────────────┘              ├── publish
#             └── draft ─────────────────────────────────┘
#
#   version   tag is v$VERSION or v$VERSION-rc.N and every manifest agrees (tools/version_sync.py),
#             before any build. Emits the asset label and the kind (release / prerelease).
#   draft     (release runs only) creates the release as a DRAFT, with no assets.
#   assemble  downloads every build's artifacts, re-verifies each .sha256, writes SHA256SUMS,
#             requires EXACTLY the manifest (tools/release_publish.py check-dir: 17 names, missing
#             or extra both fail), and uploads the set as one artifact.
#   publish   (release runs only) tools/release_publish.py attaches what assemble collected to the
#             draft, then publishes ONLY if assemble succeeded AND the local set AND the draft's
#             attached set are each exactly the manifest. A plain vX.Y.Z becomes the latest
#             release; vX.Y.Z-rc.N a pre-release that is never latest. Otherwise the release stays a
#             draft (possibly partly populated, never published); `gh run rerun --failed` finishes it.
#
# This file is the only workflow that writes a release. The Android APK used to come from
# app-android.yml on its own tag trigger, racing this one for the same release (and with no
# tag==VERSION check until hestia#1280). app-android.yml is now a reusable workflow with no tag
# trigger, called here as the `android` job behind `version`.
#
# THREE WAYS TO RUN IT:
#   push tag vX.Y.Z[-rc.N]        release: build, draft, publish.
#   dispatch with tag=vX.Y.Z      release an EXISTING tag (same as the push; bare tag only).
#   dispatch with tag empty       DRY RUN: build every job from the dispatched ref and upload the
#                                 artifacts (one `hestia-release-*` artifact holds the full set).
#                                 No release, not even a draft, is created. Assets are labelled
#                                 v$VERSION-dryrun.<sha7> so they cannot pass for a release.
#
# RELEASE INPUTS ARE PART OF THE ARTIFACT. Hestia consumes Web4 crates through sibling path
# dependencies, which Cargo.lock cannot pin. Integration CI tracks Web4 main; releases MUST NOT.
# Every build job here checks out web4 at the hestia source's `web4.pin`, the single source of
# truth for the cross-repo source that produced the bytes. Bump it deliberately before tagging.
#
# NOT BUILT: Windows (daemon and desktop) — the daemon has no Windows target until #342 makes its
# Unix file-mode calls portable, and the app follows the daemon. Signing: no signing secrets exist,
# so the desktop bundles are UNSIGNED (macOS is ad-hoc signed so Apple Silicon will run it at all)
# and the APK is debug-keystore signed. README "Installing the desktop app" covers what that means
# for Gatekeeper and AppImage. No updater plugin: that is a separate decision.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.3.0). Leave EMPTY for a dry run: build everything, upload artifacts, create no release.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Two runs for the same tag must not interleave their draft/publish steps (one could publish while
# the other deletes and re-uploads assets). The key is the BARE tag for both triggers: a tag push has
# github.ref_name == v0.3.0 and a dispatch has inputs.tag == v0.3.0, so both lock `release-v0.3.0`.
# (It once used github.ref, which is `refs/tags/v0.3.0` on push: two different locks; Codex,
# hestia#1283.) `version` refuses a dispatched tag that is not bare, so the key cannot be dodged by
# typing `refs/tags/v0.3.0`. A dry run locks on its branch name. tools/release_workflow_test.py
# evaluates this expression for both triggers and requires equal keys.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ONE VERSION, ONE TAG. The daemon, the app, the wire crate and the plugin SDKs release in
  # lockstep: the root VERSION file is the number, and tools/version_sync.py checks every manifest
  # against it. A release is refused before any build when the tag is not v$VERSION or
  # v$VERSION-rc.N, or any manifest disagrees, so a tag can never publish artifacts whose version
  # says something else. This now covers the APK too (app-android.yml built one for any `v[0-9]*`
  # tag, e.g. `v1`). RELEASE CANDIDATES (dp, 2026-10-12): `vX.Y.Z-rc.N` publishes as a GitHub
  # pre-release that is never `latest`, so the installer (releases/latest, #1279) never serves one;
  # plain `vX.Y.Z` publishes as the latest release. `kind` comes from version_sync.py --tag-kind,
  # the same parser that accepted the tag.
  version:
    name: tag equals VERSION
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      tag: ${{ steps.mode.outputs.tag }}
      ref: ${{ steps.mode.outputs.ref }}
      label: ${{ steps.label.outputs.label }}
      kind: ${{ steps.label.outputs.kind }}
    steps:
      - name: Resolve mode (release or dry run)
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            test "$REF_TYPE" = tag || { echo "push trigger is tags-only; got $REF_TYPE"; exit 1; }
            tag="$REF_NAME"; publish=true; ref="refs/tags/$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            # Bare tag only: the concurrency key and the checkout ref both assume it.
            [[ "$INPUT_TAG" =~ ^v[0-9] ]] || { echo "::error::tag input must be a bare tag like v0.3.0, got '$INPUT_TAG'"; exit 1; }
            tag="$INPUT_TAG"; publish=true; ref="refs/tags/$INPUT_TAG"
          else
            tag=""; publish=false; ref="$SHA"
          fi
          echo "mode: publish=$publish tag=${tag:-<none>} ref=$ref"
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ steps.mode.outputs.ref }}

      - name: Tag and every manifest agree with VERSION
        id: label
        shell: bash
        env:
          TAG: ${{ steps.mode.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            python3 hestia/tools/version_sync.py --tag "$TAG"
            label="$TAG"
            kind="$(python3 hestia/tools/version_sync.py --tag-kind "$TAG")"
          else
            python3 hestia/tools/version_sync.py
            label="v$(python3 hestia/tools/version_sync.py --print)-dryrun.${SHA:0:7}"
            kind=none
          fi
          echo "asset label: $label (kind: $kind)"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  # ── daemon ────────────────────────────────────────────────────────────────────────────────────
  build:
    name: daemon ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fleet targets in order: CBP/Thor/Legion/Nomad (x86_64 linux),
          # Sprout (aarch64 linux/Jetson), McNugget (aarch64 darwin/M-series).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # x86_64-pc-windows-msvc is OUT pending source portability: the daemon
          # uses std::os::unix + Permissions::set_mode (Unix-only). SQLCipher now
          # builds on windows (vendored OpenSSL), so the remaining work is cfg-gating
          # the Unix file-mode calls — filed as #342. Linux + macOS cover the fleet.
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      # Two repos as SIBLING subdirs of the workspace — the pattern ci.yml proved
      # green. hestia/core has path deps into ../../web4/..., so the release must
      # materialize the same layout, with Web4 pinned by the hestia source being released.
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ needs.version.outputs.ref }}

      - name: Read pinned web4 rev
        id: web4pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$(grep -oiE '[0-9a-f]{40}' hestia/web4.pin | head -1)"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          ref: ${{ steps.web4pin.outputs.rev }}
          path: web4

      - name: Record release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "hestia_ref=${{ needs.version.outputs.ref }}"
          echo "web4_ref=${{ steps.web4pin.outputs.rev }}"
          test "$(git -C web4 rev-parse HEAD)" = "${{ steps.web4pin.outputs.rev }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build hestia
        working-directory: hestia/core
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The build id is `git describe --tags --match 'v[0-9]*'` (core/build.rs). Checked out at the
      # tag, that is the full tag (v0.3.0 or v0.3.0-rc.1), so `--version` names the release it
      # shipped in; a dry run names its commit. Every target is native on its runner, so run it.
      - name: --version carries the full tag
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          v="$(hestia/core/target/${{ matrix.target }}/release/hestia --version)"
          echo "$v"
          if [ -n "$TAG" ]; then want="($TAG)"; else want="(${SHA:0:7}"; fi
          case "$v" in *"$want"*) ;; *) echo "::error::--version '$v' does not carry '$want'"; exit 1 ;; esac

      - name: Stage artifacts
        shell: bash
        env:
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          set -euo pipefail
          STAGE="hestia-${LABEL}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "hestia/core/target/${{ matrix.target }}/release/hestia" "dist/${STAGE}/"
          cp hestia/README.md hestia/LICENSE "dist/${STAGE}/" 2>/dev/null || true
          (cd dist && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          (cd dist && { command -v sha256sum >/dev/null 2>&1 && sha256sum "${STAGE}.tar.gz" || shasum -a 256 "${STAGE}.tar.gz"; } > "${STAGE}.tar.gz.sha256")
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-daemon-${{ matrix.target }}
          path: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # ── desktop app (Tauri 2) ─────────────────────────────────────────────────────────────────────
  # Windows is skipped with the daemon (#342): the app is the daemon's operator console, and a
  # Windows bundle with no Windows daemon to pair with is not a release.
  desktop:
    name: desktop ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not latest: an AppImage runs only on glibc >= the build host's, so the
          # older base reaches more distros. It also still ships libfuse2, which linuxdeploy needs.
          - platform: x86_64-linux
            os: ubuntu-22.04
            bundles: appimage,deb
          - platform: aarch64-macos
            os: macos-14
            bundles: app,dmg
    steps:
      # app/src-tauri path-depends on ../../../web4/web4-core: the same sibling layout and the
      # same web4.pin as the daemon build.
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ needs.version.outputs.ref }}

      - name: Read pinned web4 rev
        id: web4pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$(grep -oiE '[0-9a-f]{40}' hestia/web4.pin | head -1)"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          ref: ${{ steps.web4pin.outputs.rev }}
          path: web4

      - name: Record release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "hestia_ref=${{ needs.version.outputs.ref }}"
          echo "web4_ref=${{ steps.web4pin.outputs.rev }}"
          test "$(git -C web4 rev-parse HEAD)" = "${{ steps.web4pin.outputs.rev }}"

      # react-router 8.3 needs Node >= 22.22; same pin as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: hestia/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/app/src-tauri -> target
          key: desktop-${{ matrix.platform }}

      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file

      - name: npm ci
        working-directory: hestia/app
        run: npm ci

      # Unsigned: no signing secrets exist. On macOS the bundle is ad-hoc signed
      # (signingIdentity "-"): Apple Silicon refuses to run arm64 code with no signature at all,
      # and an ad-hoc signature is what an unsigned local build gets anyway. It is NOT a Developer
      # ID signature and is not notarized, so Gatekeeper still blocks the first launch.
      - name: tauri build (linux)
        if: runner.os == 'Linux'
        working-directory: hestia/app
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}

      - name: tauri build (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        working-directory: hestia/app
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Stage bundles with versioned names
        shell: bash
        env:
          LABEL: ${{ needs.version.outputs.label }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          B=hestia/app/src-tauri/target/release/bundle
          find "$B" -maxdepth 2
          one() { # the single match of a glob, or fail loudly
            local m=( $1 )
            if [ "${#m[@]}" -ne 1 ] || [ ! -e "${m[0]}" ]; then
              echo "::error::expected exactly one $1, found: ${m[*]}" >&2; return 1
            fi
            printf '%s\n' "${m[0]}"
          }
          mkdir -p dist
          base="hestia-app-${LABEL}-${PLATFORM}"
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$(one "$B/appimage/*.AppImage")" "dist/${base}.AppImage"
            chmod +x "dist/${base}.AppImage"
            cp "$(one "$B/deb/*.deb")" "dist/${base}.deb"
            dpkg-deb --info "dist/${base}.deb" | grep -E 'Package|Version|Architecture'
            # The deb is `hestia-app`, never `hestia`: that name is reserved for a future daemon
            # deb. Tauri derives Package from productName (kebab-cased) and has no separate
            # field, so app/src-tauri/tauri.linux.conf.json sets productName "hestia-app" for
            # Linux only (identifier and window title unchanged; linux/hestia-app.desktop keeps
            # the menu entry "Hestia").
            test "$(dpkg-deb -f "dist/${base}.deb" Package)" = hestia-app
            dpkg-deb -c "dist/${base}.deb" | grep -E ' (\./)?usr/bin/hestia-app$'   # no -q: an early exit would SIGPIPE dpkg-deb under pipefail
          else
            app="$(one "$B/macos/*.app")"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
            tar -C "$(dirname "$app")" -czf "dist/${base}.app.tar.gz" "$(basename "$app")"
            cp "$(one "$B/dmg/*.dmg")" "dist/${base}.dmg"
          fi
          cd dist
          for f in hestia-app-*; do
            { command -v sha256sum >/dev/null 2>&1 && sha256sum "$f" || shasum -a 256 "$f"; } > "$f.sha256"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-desktop-${{ matrix.platform }}
          path: dist/hestia-app-*
          if-no-files-found: error
          retention-days: 7

  # ── android (Tauri 2) ─────────────────────────────────────────────────────────────────────────
  # The recipe lives in app-android.yml (reusable; fixed in hestia#1280, branch run 38196486372
  # produced a working APK) so a manual APK build and the release build share it. It has no tag
  # trigger of its own any more: it builds only behind this file's `version` gate, and only
  # `publish` below attaches the APK. Debug-keystore signed.
  android:
    name: android
    needs: version
    uses: ./.github/workflows/app-android.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      label: ${{ needs.version.outputs.label }}
    # The four ANDROID_* keystore values (app-android.yml). Absent: debug-keystore signed.
    secrets: inherit

  # ── one release ───────────────────────────────────────────────────────────────────────────────
  # Created as a DRAFT before any asset exists, so there is never a published release that is
  # still filling. Release runs only: a dry run never reaches this job.
  draft:
    name: create draft release
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Create the draft (or reuse this tag's existing draft)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAG"
          # `gh release view <tag>` cannot see drafts (the by-tag endpoint omits them), so list.
          existing="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")"
          n=$(printf '%s' "$existing" | grep -c . || true)
          if [ "$n" -gt 1 ]; then
            echo "::error::$n releases already exist for $TAG; resolve by hand"; echo "$existing"; exit 1
          elif [ "$n" -eq 1 ]; then
            case "$existing" in
              *" true") echo "reusing existing draft for $TAG: $existing" ;;
              *) echo "::error::$TAG is already PUBLISHED; refusing to modify a published release"; exit 1 ;;
            esac
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Draft: assets are being attached by release.yml run ${{ github.run_id }}."
          fi

  assemble:
    name: assemble and verify assets
    needs: [version, build, desktop, android]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    # id-token + attestations: the keyless provenance step below (release runs only).
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      # Only for tools/release_publish.py: the one manifest assemble and publish both enforce.
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ needs.version.outputs.ref }}

      - name: Download every build artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Verify checksums and require exactly the manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          ls -la
          # Re-verify every per-asset checksum here, on a third machine, after the artifact
          # round-trip, rather than trusting the build host's line.
          bad=0
          for s in *.sha256; do
            [ -e "$s" ] || continue
            sha256sum -c "$s" || { echo "::error::checksum mismatch: $s"; bad=1; }
          done
          assets="$(ls | grep -v '\.sha256$' | grep -vx 'SHA256SUMS' || true)"
          if [ -n "$assets" ]; then sha256sum $assets > SHA256SUMS; else : > SHA256SUMS; fi
          cat SHA256SUMS
          { echo "### Assets ($LABEL)"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Exactly the 17 names (8 assets, 8 .sha256, SHA256SUMS): missing AND extra both fail.
          ok=0
          python3 ../hestia/tools/release_publish.py check-dir . "$LABEL" || ok=1
          test "$bad" -eq 0 && test "$ok" -eq 0

      # PROVENANCE FOR EVERY ASSET (dp, 2026-10-14, web4#904 signing option b): a keyless Sigstore
      # attestation, signed through this workflow's GitHub OIDC identity, so anyone can check that
      # an asset was built by this repository's release workflow at this tag:
      #   gh attestation verify <asset> --repo dp-web4/hestia
      # No key to hold or lose. Release runs only (a dry run publishes nothing to attest), and only
      # over a verified, complete set (the step above failing skips it).
      - name: Attest build provenance
        if: needs.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hestia-*
            dist/SHA256SUMS

      # Uploaded even when verification failed, so `publish` can attach what exists to the draft
      # (it will not publish) and a human can see exactly what was built.
      - name: Upload the assembled set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hestia-release-${{ needs.version.outputs.label }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  publish:
    name: attach assets and publish
    needs: [version, draft, assemble, android]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ needs.version.outputs.ref }}

      - name: Read pinned web4 rev
        id: web4pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$(grep -oiE '[0-9a-f]{40}' hestia/web4.pin | head -1)"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # FATAL when assemble succeeded (Codex, hestia#1283: continue-on-error here let a failed
      # download publish an EMPTY release). Tolerated only when assemble already failed, so the
      # draft can still receive whatever was built; release_publish.py will not publish then.
      - name: Download the assembled set
        uses: actions/download-artifact@v4
        continue-on-error: ${{ needs.assemble.result != 'success' }}
        with:
          name: hestia-release-${{ needs.version.outputs.label }}
          path: dist

      - name: Find the draft
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          row="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")"
          test "$(printf '%s\n' "$row" | grep -c .)" -eq 1 || { echo "::error::no unique draft for $TAG"; exit 1; }
          echo "id=$row" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        env:
          WEB4: ${{ steps.web4pin.outputs.rev }}
          KIND: ${{ needs.version.outputs.kind }}
          APK_SIGNING: ${{ needs.android.outputs.signing == 'release' && 'signed with the release key' || 'signed with the debug keystore, so a later release-key APK cannot upgrade it in place' }}
        run: |
          set -euo pipefail
          U="https://github.com/$GH_REPO/releases/download/$TAG"
          cat > notes.md <<EOF
          hestia $TAG: the daemon, the desktop app and the Android app, one version, one tag.

          | | asset |
          |---|---|
          | daemon, Linux x86_64 | \`hestia-$TAG-x86_64-unknown-linux-gnu.tar.gz\` |
          | daemon, Linux aarch64 (Jetson) | \`hestia-$TAG-aarch64-unknown-linux-gnu.tar.gz\` |
          | daemon, macOS Apple Silicon | \`hestia-$TAG-aarch64-apple-darwin.tar.gz\` |
          | desktop app, Linux x86_64 | \`hestia-app-$TAG-x86_64-linux.AppImage\` or \`.deb\` |
          | desktop app, macOS Apple Silicon | \`hestia-app-$TAG-aarch64-macos.dmg\` or \`.app.tar.gz\` |
          | Android app | \`hestia-app-$TAG-android-universal.apk\` |

          Every asset has a \`.sha256\`; \`SHA256SUMS\` covers them all.

          Daemon (Linux example):
          \`\`\`sh
          curl -L $U/hestia-$TAG-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          ./hestia-$TAG-x86_64-unknown-linux-gnu/hestia --version
          \`\`\`
          The dashboard HTML is baked into the daemon binary; nothing else is required to run.

          **Provenance:** every asset carries a Sigstore build attestation from this repository's
          release workflow. Check one with \`gh attestation verify <asset> --repo $GH_REPO\`.

          **Platform signing:** the Android APK is $APK_SIGNING. The macOS app is ad-hoc signed,
          not notarized, and the Linux bundles are unsigned. See "Installing the desktop app" in
          the README for the Gatekeeper and AppImage steps. No Windows build: the daemon has no
          Windows target yet (#342).

          Build provenance: hestia \`$TAG\`, Web4 \`$WEB4\` (web4.pin).
          EOF
          if [ "$KIND" = prerelease ]; then
            printf '\n**Release candidate.** Published as a pre-release, never as latest: the installer does not serve it.\n' >> notes.md
          fi
          cat notes.md

      # Attach, re-check, publish: tools/release_publish.py (tested with a mocked gh in
      # tools/release_publish_test.py). It publishes ONLY if assemble succeeded AND the local set
      # AND the draft's attached set are each exactly the manifest AND the release is still a
      # draft. A plain vX.Y.Z becomes the latest release; vX.Y.Z-rc.N a pre-release, never latest.
      # Anything else leaves a draft holding whatever was built; `gh run rerun --failed` finishes it.
      - name: Attach assets and publish (only on the full manifest)
        shell: bash
        env:
          ASSEMBLE: ${{ needs.assemble.result }}
          KIND: ${{ needs.version.outputs.kind }}
        run: |
          set -euo pipefail
          python3 hestia/tools/release_publish.py publish --tag "$TAG" \
            --release-id "${{ steps.rel.outputs.id }}" --dist dist \
            --assemble "$ASSEMBLE" --kind "$KIND" --notes notes.md
          gh api "repos/$GH_REPO/releases/${{ steps.rel.outputs.id }}" \
            --jq '{html_url, draft, prerelease, assets: (.assets | length)}'
