name: release

# Builds prebuilt hestia binaries and attaches them to a GitHub Release.
# Tag pushes / workflow_dispatch publish. Pull requests run the SAME build
# matrix as a release smoke test but never publish, so platform/toolchain and
# packaging regressions are measured before they reach a tag.
#
# RELEASE INPUTS ARE PART OF THE ARTIFACT. Hestia currently consumes Web4
# crates through sibling path dependencies, which Cargo.lock cannot pin.
# Integration CI intentionally tracks Web4 main; releases MUST NOT. Bump
# WEB4_REF deliberately before creating each release tag.
env:
  WEB4_REF: 9958fc6a37279a8fad2872fec1a07ea3ec92224b

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.4). Must already exist.'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          # Measured on release run 31457488128: the aarch64 macOS daemon
          # compiled successfully. The job failed only in staging because the
          # runner provides `shasum`, not GNU `sha256sum`. Restore the target and
          # make checksum generation portable below.
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          # Windows remains temporarily out. Its first real build reached
          # libsqlite3-sys and failed because bundled SQLCipher could not discover
          # an OpenSSL development root. #336 restores it independently.
    steps:
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4
          ref: ${{ env.WEB4_REF }}

      - name: Record release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "hestia_ref=${{ github.event.inputs.tag || github.ref_name }}"
          echo "web4_ref=${WEB4_REF}"
          test "$(git -C web4 rev-parse HEAD)" = "$WEB4_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build hestia
        working-directory: hestia/core
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifacts (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="hestia-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "hestia/core/target/${{ matrix.target }}/release/hestia" "dist/${STAGE}/"
          cp hestia/README.md hestia/LICENSE "dist/${STAGE}/" 2>/dev/null || true
          (cd dist && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
            else
              echo "no SHA-256 checksum tool (sha256sum or shasum) on runner" >&2
              exit 1
            fi
          )
          ls -la dist/

      - name: Stage artifacts (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $stage = "hestia-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage" | Out-Null
          Copy-Item "hestia/core/target/${{ matrix.target }}/release/hestia.exe" "dist/$stage/"
          if (Test-Path "hestia/README.md") { Copy-Item "hestia/README.md" "dist/$stage/" }
          if (Test-Path "hestia/LICENSE") { Copy-Item "hestia/LICENSE" "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Set-Content "dist/$stage.zip.sha256"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hestia-${{ matrix.target }}
          path: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
            dist/hestia-*.zip
            dist/hestia-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Prebuilt `hestia` daemon binaries for the targets attached to this release.

            Build provenance: Web4 `${{ env.WEB4_REF }}`.

            Linux example:
            ```sh
            curl -L https://github.com/dp-web4/hestia/releases/download/${{ github.event.inputs.tag || github.ref_name }}/hestia-${{ github.event.inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz | tar -xz
            ./hestia-${{ github.event.inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu/hestia --version
            ```

            The dashboard HTML is baked into the binary; nothing else is required to run.
          draft: false
          prerelease: false
          # Windows is still absent, so zip globs are intentionally unmatched.
          # Restore strict matching when #336 returns the Windows matrix row.
          fail_on_unmatched_files: false
          files: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
            dist/hestia-*.zip
            dist/hestia-*.zip.sha256
