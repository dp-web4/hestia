name: release

# Builds prebuilt hestia binaries for the four primary targets and
# attaches them to a GitHub Release. Trigger by pushing a tag matching
# v*.*.* (e.g. v0.0.4). The dashboard HTML is baked into the binary
# via include_str!, so the single executable is the entire artifact.
#
# RELEASE INPUTS ARE PART OF THE ARTIFACT. Hestia currently consumes Web4
# crates through sibling path dependencies, which Cargo.lock cannot pin.
# Integration CI intentionally tracks Web4 main; releases MUST NOT. Bump
# WEB4_REF deliberately before creating each release tag. The workflow stored
# at that tag then records the exact cross-repo source that produced its bytes.
env:
  WEB4_REF: 9958fc6a37279a8fad2872fec1a07ea3ec92224b

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.4). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fleet targets in order: CBP/Thor/Legion/Nomad (x86_64 linux),
          # Sprout (aarch64 linux/Jetson), McNugget (aarch64 darwin/M-series).
          # Windows is a bonus — no fleet machine runs Windows but the
          # plugin reaches Windows users via Claude Code.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          # x86_64-pc-windows-msvc is OUT pending source portability: the daemon
          # uses std::os::unix + Permissions::set_mode (Unix-only). SQLCipher now
          # builds on windows (vendored OpenSSL), so the remaining work is cfg-gating
          # the Unix file-mode calls — filed as follow-up. Linux + macOS cover the
          # whole fleet.
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
    steps:
      # Two repos as SIBLING subdirs of the workspace — the pattern ci.yml proved
      # green. hestia/core has path deps into ../../web4/..., so the release must
      # materialize the same layout. Unlike integration CI, Web4 is pinned above:
      # rebuilding one Hestia tag later must not silently produce different bytes.
      - uses: actions/checkout@v4
        with:
          path: hestia
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Read pinned web4 rev
        id: web4pin
        shell: bash
        run: echo "rev=$(grep -oiE '[0-9a-f]{7,40}' hestia/web4.pin | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          ref: ${{ steps.web4pin.outputs.rev }}
          path: web4
          ref: ${{ env.WEB4_REF }}

      - name: Record release inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "hestia_ref=${{ github.event.inputs.tag || github.ref_name }}"
          echo "web4_ref=${WEB4_REF}"
          test "$(git -C web4 rev-parse HEAD)" = "$WEB4_REF"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build hestia
        working-directory: hestia/core
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifacts (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="hestia-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "hestia/core/target/${{ matrix.target }}/release/hestia" "dist/${STAGE}/"
          cp hestia/README.md hestia/LICENSE "dist/${STAGE}/" 2>/dev/null || true
          (cd dist && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          (cd dist && { command -v sha256sum >/dev/null 2>&1 && sha256sum "${STAGE}.tar.gz" || shasum -a 256 "${STAGE}.tar.gz"; } > "${STAGE}.tar.gz.sha256")
          ls -la dist/

      - name: Stage artifacts (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $stage = "hestia-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage" | Out-Null
          Copy-Item "hestia/core/target/${{ matrix.target }}/release/hestia.exe" "dist/$stage/"
          if (Test-Path "hestia/README.md") { Copy-Item "hestia/README.md" "dist/$stage/" }
          if (Test-Path "hestia/LICENSE") { Copy-Item "hestia/LICENSE" "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Set-Content "dist/$stage.zip.sha256"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hestia-${{ matrix.target }}
          path: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
            dist/hestia-*.zip
            dist/hestia-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Prebuilt `hestia` daemon binaries for the four primary targets.

            Build provenance: Web4 `${{ env.WEB4_REF }}`.

            Install (Linux / macOS):
            ```sh
            curl -L https://github.com/dp-web4/hestia/releases/download/${{ github.event.inputs.tag || github.ref_name }}/hestia-${{ github.event.inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz | tar -xz
            ./hestia-${{ github.event.inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu/hestia --version
            ```

            The dashboard HTML is baked into the binary; nothing else is required to run.
          draft: false
          prerelease: false
          fail_on_unmatched_files: false  # windows .zip absent while win/mac are out (SQLCipher runner toolchain); tolerate the missing pattern
          files: |
            dist/hestia-*.tar.gz
            dist/hestia-*.tar.gz.sha256
            dist/hestia-*.zip
            dist/hestia-*.zip.sha256
