        run: |
          set -euo pipefail
          git config user.name "gpt-sweep"
          git config user.email "actions@users.noreply.github.com"
          if git log --format=%B -8 | grep -q "derive the promise from the predicate"; then
            echo "already currentized"
            exit 0
          fi
          git cherry-pick 85ef11248109d4da18046e5cdb8998de5c0221dc
          git cherry-pick 7d6287e084b0c2f6ade855e40f760b998d82ac05
          git cherry-pick a486b54c964aa25b4e2e7a8eed39ca02a6ef6555
          git push
