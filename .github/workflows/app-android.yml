name: app-android

# Builds the Hestia app for Android (Tauri 2) and uploads the APK + .sha256 as a workflow artifact.
# It NEVER publishes anything and has NO tag trigger.
#
# ONE TAG, ONE RELEASE (web4#904). This used to trigger on release tags itself and attach the APK
# to the release on its own, racing release.yml for the same release and (until hestia#1280)
# skipping the tag==VERSION check, so a stray tag like `v1` got an APK. Now release.yml calls this
# file as its `android` job (workflow_call) behind its `version` gate, and release.yml's `publish`
# job is the only thing that attaches the APK. The recipe lives here, once, so a manual APK build
# (workflow_dispatch) and the release build cannot drift apart.
#
# SIGNING (dp, 2026-10-14, web4#904 option b). When the repository holds the release keystore
# (ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD),
# the APK is signed with it; gen/android/app/build.gradle.kts reads keystore.properties. Without
# them (a fork, a dispatch before the key exists) it falls back to the Gradle debug keystore and
# says so in the step summary. The APK must never switch keys after the release key ships: a
# device cannot upgrade across keys.

on:
  workflow_call:
    inputs:
      ref:
        description: 'hestia ref to build (release.yml passes the tag, or the sha for a dry run)'
        required: true
        type: string
      label:
        description: 'asset label, e.g. v0.3.0 (release.yml has already checked it against VERSION)'
        required: true
        type: string
    outputs:
      signing:
        description: "'release' or 'debug': the key the APK was signed with"
        value: ${{ jobs.android.outputs.signing }}
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  # Manual APK build from any branch: artifact only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: build android apk
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.key.outputs.signing }}
    steps:
      # app/src-tauri path-depends on ../../../web4/web4-core, so materialize the same sibling
      # layout release.yml does, with web4 at the hestia source's web4.pin (a release must not
      # build against a moving web4 main).
      - uses: actions/checkout@v4
        with:
          path: hestia
          # Empty on a manual dispatch: checkout then uses the dispatched ref.
          ref: ${{ inputs.ref }}

      # A manual build still refuses a tree whose manifests disagree with VERSION. A release build
      # was already checked (with its tag) by release.yml's `version` job.
      - name: Manifests agree with VERSION; resolve the asset label
        id: label
        shell: bash
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          python3 hestia/tools/version_sync.py
          if [ -z "$LABEL" ]; then
            LABEL="v$(python3 hestia/tools/version_sync.py --print)-dev.$(git -C hestia rev-parse --short=7 HEAD)"
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Read pinned web4 rev
        id: web4pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$(grep -oiE '[0-9a-f]{40}' hestia/web4.pin | head -1)"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          ref: ${{ steps.web4pin.outputs.rev }}
          path: web4

      # react-router 8.3 needs Node >= 22; same pin as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list includes the long-removed `tools` package, and
        # sdkmanager now fails on it ("Failed to find package 'tools'", run 38195474570).
        with:
          packages: platform-tools
        # NDK: the runner image's preinstalled NDK is auto-detected by the
        # tauri CLI (verified in run 27447314547 — compiled clean with it).

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/app/src-tauri -> target
          key: android

      # The generated Gradle project (gen/android/buildSrc BuildTask.kt)
      # hard-invokes `cargo tauri android android-studio-script`, so the
      # RUST tauri-cli must exist as a cargo subcommand — the npm CLI is
      # not enough. Pinned to match the tauri crate version in Cargo.toml.
      - name: Install cargo tauri-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.2

      - name: npm ci
        working-directory: hestia/app
        run: npm ci

      # Never echoes a value. The keystore and properties file live in the gitignored gen/android
      # dir of this runner's checkout and die with the runner.
      - name: Release key (when configured)
        id: key
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          G=hestia/app/src-tauri/gen/android
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$G/release.jks"
            umask 077
            {
              echo "storeFile=release.jks"
              echo "password=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > "$G/keystore.properties"
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "APK signing: **release key**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "APK signing: debug keystore (release key not configured)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android APK (release profile)
        working-directory: hestia/app
        run: cargo tauri android build --apk

      # A release-signed APK proves it: apksigner prints the signer's certificate digest, which
      # the summary records so a later key change is visible.
      - name: Verify the APK signature
        if: steps.key.outputs.signing == 'release'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find hestia/app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs "$APK" | tee cert.txt
          { echo '```'; grep -i 'SHA-256' cert.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage APK with versioned name
        shell: bash
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail
          OUT=hestia/app/src-tauri/gen/android/app/build/outputs/apk
          n=$(find "$OUT" -name '*.apk' | wc -l)
          test "$n" -eq 1 || { echo "::error::expected exactly one APK, found $n"; find "$OUT" -name '*.apk'; exit 1; }
          APK=$(find "$OUT" -name '*.apk')
          mkdir -p dist
          f="hestia-app-${LABEL}-android-universal.apk"
          cp "$APK" "dist/$f"
          (cd dist && sha256sum "$f" > "$f.sha256")
          ls -la dist/

      # The `asset-` prefix is what release.yml's `assemble` job collects.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-android
          path: dist/hestia-app-*
          if-no-files-found: error
          retention-days: 30
