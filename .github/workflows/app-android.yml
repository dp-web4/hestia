name: app-android

# Builds the Hestia cross-platform app for Android (Tauri 2) and uploads
# the APK as a workflow artifact — and, when triggered by a release tag,
# attaches it to that GitHub Release for direct download + sideload.
#
# ONE VERSION, ONE TAG (web4#904; dp, 2026-10-11). The app and the daemon release in lockstep,
# so this triggers on the same `v[0-9]*` release tags as release.yml, never on `app-v*`: an
# `app-v*` tag is an ancestor of main and once became every daemon's build id
# (app-v0.1.2-761-g9a6a5c2, 2026-08-08). One tag publishes the binaries and the APK.
#
# The APK is debug-signed (Gradle debug keystore): installable on any
# device with "install unknown apps" enabled. A Play-Store-grade signing
# config can be layered in later via secrets without changing the build.
#
# Companion to release.yml (which builds the daemon/CLI binaries).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  # The same gate as release.yml's `version` job, because this workflow publishes to the same
  # release independently of it: without this, a `v9.9.9` tag on a 0.3.0 tree was refused for
  # the daemon and still got a 0.3.0 APK attached (Codex, hestia#1280). Every run checks that
  # the manifests agree with VERSION; a tag run also requires the tag to be exactly v$VERSION.
  # A branch dispatch builds an artifact only and publishes nothing, so it needs no tag.
  version:
    name: tag equals VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hestia
      - name: Every manifest agrees with VERSION (and a tag equals it)
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            python3 hestia/tools/version_sync.py --tag "$REF_NAME"
          else
            python3 hestia/tools/version_sync.py
          fi

  android:
    name: build android apk
    needs: version
    runs-on: ubuntu-latest
    steps:
      # app/src-tauri path-depends on ../../../web4/web4-core, so materialize the same sibling
      # layout release.yml does, with web4 at the hestia source's web4.pin (a release must not
      # build against a moving web4 main).
      - uses: actions/checkout@v4
        with:
          path: hestia

      - name: Read pinned web4 rev
        id: web4pin
        shell: bash
        run: |
          set -euo pipefail
          rev="$(grep -oiE '[0-9a-f]{40}' hestia/web4.pin | head -1)"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          ref: ${{ steps.web4pin.outputs.rev }}
          path: web4

      # react-router 8.3 needs Node >= 22; same pin as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list includes the long-removed `tools` package, and
        # sdkmanager now fails on it ("Failed to find package 'tools'", run 38195474570).
        with:
          packages: platform-tools
        # NDK: the runner image's preinstalled NDK is auto-detected by the
        # tauri CLI (verified in run 27447314547 — compiled clean with it).

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hestia/app/src-tauri -> target

      # The generated Gradle project (gen/android/buildSrc BuildTask.kt)
      # hard-invokes `cargo tauri android android-studio-script`, so the
      # RUST tauri-cli must exist as a cargo subcommand — the npm CLI is
      # not enough. Pinned to match the tauri crate version in Cargo.toml.
      - name: Install cargo tauri-cli (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.2

      - name: npm ci
        working-directory: hestia/app
        run: npm ci

      - name: Build Android APK (release profile, debug-keystore signed)
        working-directory: hestia/app
        run: cargo tauri android build --apk

      - name: Stage APK with versioned name
        run: |
          APK=$(find hestia/app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          REF="${GITHUB_REF_NAME:-dev}"
          REF="${REF//\//-}"   # a dispatched branch (release/x) must not become a directory
          mkdir -p dist
          cp "$APK" "dist/hestia-${REF}-android-universal.apk"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hestia-android-apk
          path: dist/*.apk
          retention-days: 30

      - name: Attach to release (tag builds only)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
