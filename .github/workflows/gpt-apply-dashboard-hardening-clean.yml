name: apply dashboard deployment hardening clean

on:
  push:
    branches:
      - gpt/dashboard-deployment-update-clean
    paths:
      - .github/workflows/gpt-apply-dashboard-hardening-clean.yml
      - tools/gpt_harden_dashboard_update.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/dashboard-deployment-update-clean
          path: hestia
      - uses: actions/checkout@v4
        with:
          repository: dp-web4/web4
          path: web4
      - name: Apply hardening patch
        working-directory: hestia
        run: python3 tools/gpt_harden_dashboard_update.py
      - name: Static deployment contract
        working-directory: hestia
        run: python3 tools/dashboard_deployment_update_contract_test.py
      - name: Deployment shell syntax
        working-directory: hestia
        run: bash -n deploy/from-main/hestia-deploy.sh
      - name: HTTP deployment update tests
        working-directory: hestia
        run: cargo test --manifest-path core/Cargo.toml deployment_update_tests -- --nocapture
      - name: Dashboard deployment status test
        working-directory: hestia
        run: cargo test --manifest-path core/Cargo.toml deployment_update_status_projects_supervisor_states_without_inventing_success -- --nocapture
      - name: Diff hygiene
        working-directory: hestia
        run: git diff --check
      - name: Remove temporary machinery and commit
        working-directory: hestia
        run: |
          rm tools/gpt_harden_dashboard_update.py
          rm .github/workflows/gpt-apply-dashboard-hardening-clean.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'dashboard: harden deployment update publication'
          git push origin HEAD:gpt/dashboard-deployment-update-clean
