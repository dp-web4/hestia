name: gpt fix invitation note 694

on:
  push:
    branches:
      - gpt/fix-invitation-note-694

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_invitation_note_694.py
      - run: cargo test --manifest-path core/Cargo.toml invitation_note_contract_tests --locked
      - name: Commit source correction if needed
        run: |
          if git diff --quiet -- core/src/server/handler.rs; then
            exit 0
          fi
          git config user.name "gpt-sweep"
          git config user.email "actions@users.noreply.github.com"
          git add core/src/server/handler.rs
          git commit -m "fix: make invitation note describe actual cause (#694)"
          git push
